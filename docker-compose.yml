services:
  blmbu:
    build: .
    image: blmbu-terminal
    ports:
      - "${HOST_PORT:-8787}:8787"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8787"
      CACHE_DB: /app/data/cache.db
    volumes:
      - blmbu-data:/app/data
    restart: unless-stopped

volumes:
  blmbu-data:
